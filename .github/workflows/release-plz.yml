name: Release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  release-pr:
    if: >-
      github.repository == 'codyps/rust-systemd' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Create release PR token
        if: vars.RELEASE_PLZ_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release metadata
        run: python3 .github/scripts/sync_release.py --check
      - name: Install libsystemd
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install libsystemd-dev
      - name: Prepare release PR
        id: release
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      - name: Synchronize release metadata
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number=$(jq -r '.number' <<< "$RELEASE_PR")
          release_branch=$(jq -r '.head_branch' <<< "$RELEASE_PR")
          gh pr checkout "$pr_number"
          python3 .github/scripts/sync_release.py
          cargo update --workspace
          git add Cargo.toml Cargo.lock README.md libsystemd-sys/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: synchronize release metadata'
            git push origin "HEAD:$release_branch"
          fi

  publish:
    if: >-
      github.repository == 'codyps/rust-systemd' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release metadata
        run: python3 .github/scripts/sync_release.py --check
      - name: Install libsystemd
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install libsystemd-dev
      - name: Publish with crates.io trusted publishing
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
