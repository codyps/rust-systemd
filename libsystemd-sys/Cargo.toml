[package]
name = "libsystemd-sys"
version = "0.10.1"
authors = ["Cody P Schafer <dev@codyps.com>"]
license = "LGPL-2.1-or-later WITH GCC-exception-2.0"
description = "FFI bindings to libsystemd and libelogind"
repository = "https://github.com/codyps/rust-systemd"
include = ["Cargo.toml", "**/*.rs", "build.rs", "COPYING", "/README.md", "/CHANGELOG.md"]
readme = "README.md"
documentation = "https://docs.rs/crates/libsystemd-sys"
edition = "2018"

[features]
default = ["bus", "journal"]

bus = []
journal = []
systemd_v240 = []
systemd_v241 = ["systemd_v240"]
systemd_v245 = ["systemd_v241"]
systemd_v254 = ["systemd_v245"]

[dependencies]
cfg-if = "1.0.4"
libc = "0.2.182"

[build-dependencies]
pkg-config = "0.3.18"
build-env = "0.3.0"
