[package]
name = "systemd"
version = "0.11.0"
authors = ["Cody P Schafer <dev@codyps.com>"]
license = "LGPL-2.1-or-later WITH GCC-exception-2.0"
description = "A rust interface to libsystemd/libelogind provided APIs"
repository = "https://github.com/codyps/rust-systemd"
documentation = "https://docs.rs/crate/systemd"
include = ["Cargo.toml", "src/**/*.rs", "COPYING", "/README.md", "/CHANGELOG.md"]
readme = "README.md"
edition = "2018"

[features]
default = ["bus", "journal"]

bus = ["libsystemd-sys/bus"]
journal = ["libsystemd-sys/journal"]
systemd_v240 = ["libsystemd-sys/systemd_v240"]
systemd_v241 = ["systemd_v240", "libsystemd-sys/systemd_v241"]
systemd_v245 = ["systemd_v241", "libsystemd-sys/systemd_v245"]
systemd_v254 = ["systemd_v245", "libsystemd-sys/systemd_v254"]
unstable-doc-cfg = []

[dependencies]
log = { version = "~0.4", features = ["std"] }
libc = "~0.2"
memchr = "2"
utf8-cstr = "~0.1"
foreign-types = "0.5.0"
# Id128 deserialization owns a Box<CStr>, including in downstream-only builds.
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }
#enumflags2 = "^0.5"
#enumflags2_derive = "^0.5"

[dependencies.libsystemd-sys]
path = "libsystemd-sys"
version = "0.10.0"
default-features = false

[dev-dependencies]
version-sync = "0.9.2"
doc-comment = "0.3"

[profile.release]
debug = true

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["libsystemd-sys"]

[[test]]
name = "daemon-environment"
harness = false
